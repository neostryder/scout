[package]
name = "scout-tray"
version = "0.1.0"
description = "Scout tray and menu bar panel"
edition = "2024"
publish = false

[lib]
name = "scout_tray_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.2", features = [] }

[dependencies]
tauri = { version = "2.12.3", features = ["tray-icon"] }
tauri-plugin-opener = "2.7.1"
tauri-plugin-single-instance = "2.5.3"
keyring = "4.2.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["time", "sync", "macros"] }

[profile.release]
lto = true
opt-level = "s"
strip = true
